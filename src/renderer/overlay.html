<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Microsoft YaHei", sans-serif; }
    html, body { width: 100vw; height: 100vh; background: transparent; overflow: hidden; pointer-events: none; }
    .hud-slot {
      position: absolute;
      top: 24%;
      width: 17%;
      background: rgba(9, 20, 40, 0.9);
      border: 2px solid #c8aa6e;
      border-radius: 10px;
      padding: 12px;
      color: #f0e6d2;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      display: none;
    }
    .hud-slot.best {
      border-color: #0ac8b9;
      box-shadow: 0 0 22px rgba(10, 200, 185, 0.55);
    }
    #slot-0 { left: 20.5%; }
    #slot-1 { left: 41.5%; }
    #slot-2 { left: 62.5%; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .tier { font-size: 16px; font-weight: 900; padding: 2px 8px; border-radius: 4px; background: #c8aa6e; color: #091428; }
    .tier.sp { background: #ff4655; color: #fff; }
    .winrate { font-size: 14px; font-weight: bold; color: #0ac8b9; }
    .name { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
    .badges { display: flex; gap: 6px; margin-bottom: 6px; }
    .badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .badge.best { background: #0ac8b9; color: #091428; }
    .badge.syn { background: #f0c14b; color: #091428; }
    .desc { font-size: 12px; color: #cdbe91; line-height: 1.4; }
  </style>
</head>
<body>
  <div id="slot-0" class="hud-slot"></div>
  <div id="slot-1" class="hud-slot"></div>
  <div id="slot-2" class="hud-slot"></div>
  <script src="./overlay.js"></script>
</body>
</html>
